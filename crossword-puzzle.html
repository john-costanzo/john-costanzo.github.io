<!doctype html>
<html>
	<head>
		<title>Redirecting to a specified crossword puzzle...</title>
		<!-- Google tag (gtag.js) -->
		<script
			async
			src="https://www.googletagmanager.com/gtag/js?id=G-PD1SGH4S3D"
		></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag() {
				dataLayer.push(arguments);
			}
			gtag("js", new Date());

			gtag("config", "G-PD1SGH4S3D");
		</script>

		<script>
			const PARAMS = {};

			function getAllUrlParams(url) {
				const queryString = url
					? url.split("?")[1]
					: window.location.search.slice(1);

				if (queryString) {
					queryString.split("&").forEach((param) => {
						const [key, value] = param.split("=");
						PARAMS[key] = decodeURIComponent(value);
					});
				}

				return PARAMS;
			}

			// Usage
			const params = getAllUrlParams();
			console.log(params);
		</script>
	</head>

	<body>
		<script>
			getAllUrlParams();
			var puzzle_name = PARAMS["cp"];

			if (puzzle_name !== undefined) {
				var url =
					"https://frozenpandaman.github.io/puz/?file=https://raw.githubusercontent.com/john-costanzo/john-costanzo.github.io/refs/heads/master/crossword-puzzles/" +
					puzzle_name +
					".ipuz";
				console.log(`url=${url}`);
				<!-- gtag("event", "page_view", { -->
				<!-- 	page_title: `Crossword Puzzle`, -->
				<!-- 	puzzle_name: `${puzzle_name}`, -->
				<!-- 	page_location: window.location.href, -->
				<!-- }); -->
				gtag("event", "crossword_puzzle_visited", {
					event_category: "Page",
					event_label: `CrosswordPuzzleName`,
					value: `${puzzle_name}`,
				});

				window.location.href = url;
			} else {
				gtag("event", "no_such_parameter", {
					page_title: `Crossword Puzzle: no 'cp' parameter given`,
					page_location: window.location.href,
				});
				console.error(
					`No 'cp' parameter given as the location of a crossword puzzle in ipuz format.`,
				);
			}
		</script>
	</body>
</html>
